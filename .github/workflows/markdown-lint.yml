name: markdown lint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - "main"
      - "release-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run-markdown-lint: ${{ steps.changes.outputs.markdown == 'true' }}
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: changes
        with:
          filters: |
            markdown:
              - '**.md'
              - '.github/workflows/markdown-lint.yml'

  markdown-toc:
    needs: [changes]
    if: github.event.pull_request.draft == false && needs.changes.outputs.should-run-markdown-lint == 'true'
    name: markdown toc
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install markdown-toc
        run: npm install --global markdown-toc@1.2.0

      - name: Verify markdown TOC
        run: |
          markdown-toc --bullets "-" -i CONTRIBUTING.md

          git diff --exit-code -- CONTRIBUTING.md || {
            echo "markdown table of contents is out of date"
            echo 'run: markdown-toc --bullets "-" -i CONTRIBUTING.md'
            exit 1
          }

  skip-markdown-lint:
    needs: [changes]
    if: needs.changes.outputs.should-run-markdown-lint == 'false'
    name: markdown toc
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - run: 'echo "No markdown linting required"'
