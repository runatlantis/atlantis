name: markdown lint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - "main"
      - "release-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run-markdown-lint: ${{ steps.changes.outputs.markdown == 'true' }}
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            markdown:
              - '**.md'
              - '.github/workflows/markdown-lint.yml'

  markdown-toc:
    needs: [changes]
    if: github.event.pull_request.draft == false && needs.changes.outputs.should-run-markdown-lint == 'true'
    name: markdown toc
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install markdown-toc
        run: npm install --global markdown-toc@1.2.0

      - name: Verify markdown TOC
        run: |
          markdown-toc --bullets "-" -i CONTRIBUTING.md

          git diff --exit-code -- CONTRIBUTING.md || {
            echo "markdown table of contents is out of date"
            echo 'run: markdown-toc --bullets "-" -i CONTRIBUTING.md'
            exit 1
          }

  skip-markdown-lint:
    needs: [changes]
    if: needs.changes.outputs.should-run-markdown-lint == 'false'
    name: markdown toc
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - run: 'echo "No markdown linting required"'
