name: translate-docs

# Machine-translates the website docs into the locales listed in i18n.json and
# opens a pull request with the result. Never pushes to main directly: the
# output is reviewed like any other docs change.
#
# The English tree stays where it is. Lingo.dev locates source files by
# substituting the source locale into the [locale] placeholder, so the job
# stages a throwaway copy under .lingo-src/en/ and copies the finished
# translations back to runatlantis.io/<locale>/.

on:
  push:
    branches:
      - 'main'
    paths:
      - 'runatlantis.io/docs/**/*.md'
      - 'runatlantis.io/guide/**/*.md'
      - 'runatlantis.io/blog/**/*.md'
      - 'runatlantis.io/contributing/**/*.md'
      - 'runatlantis.io/*.md'
      - 'i18n.json'
      - 'scripts/localize-links.mjs'
      - 'scripts/check-translation-integrity.mjs'
      - 'scripts/align-tables.mjs'
      - 'scripts/stage-translation-sources.sh'
      - 'scripts/fix-translated-markdown.sh'
      - 'scripts/record-translation-sources.mjs'
      - '.github/workflows/translate-docs.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-translate everything, ignoring the i18n.lock checksums'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  translate:
    # Forks have no API key and no need to open translation PRs upstream.
    if: github.repository == 'runatlantis/atlantis'
    name: Translate docs
    runs-on: ubuntu-24.04
    # Holds the translation provider key. Scoped to this job so no other
    # workflow in the repo can read it, and restricted to main in the
    # environment's deployment branch rules.
    environment: docs-translation
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Translation integrity reads history so a quarantined page, restored
          # to its committed translation, is skipped as stale instead of failing
          # against the newer English source.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Stage English sources for the translator
        run: |
          locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
          scripts/stage-translation-sources.sh $locales

      - name: Translate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Version is pinned deliberately: this is the only step the API key is
        # exposed to, and `@latest` would run whatever was published upstream
        # since the last review. Bump it like any other dependency.
        #
        # Individual files can fail when the model returns a malformed JSON
        # envelope, which gets likelier the longer the response. Retries are
        # cheap because the lockfile means a rerun only reprocesses what is
        # still missing. Files that never succeed are simply left untranslated:
        # localize-links.mjs keeps the locale buildable, so a partial run still
        # produces a reviewable PR instead of nothing.
        run: |
          completed=false
          for attempt in 1 2 3; do
            if npx --yes lingo.dev@0.138.4 run ${{ inputs.force && '--force' || '' }}; then
              echo "Translation completed on attempt ${attempt}."
              completed=true
              break
            fi
            echo "::warning::Translation attempt ${attempt} had failures; retrying."
          done

          # A total failure (bad key, exhausted quota, provider outage) must not
          # pass silently as "no changes to translate". The existing
          # translations are staged too, so look for anything the translator
          # actually changed rather than for any file at all.
          if [ "$completed" = false ]; then
            locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
            for locale in $locales; do
              if ! diff -rq "runatlantis.io/${locale}" ".lingo-src/${locale}" > /dev/null 2>&1; then
                exit 0
              fi
            done
            echo "::error::lingo.dev failed on every attempt and changed no translation. See the attempts above for the provider error, for example an exhausted API quota."
            exit 1
          fi

      - name: Copy translations into the site
        run: |
          shopt -s nullglob
          for dir in .lingo-src/*/; do
            locale="$(basename "$dir")"
            [ "$locale" = "en" ] && continue
            mkdir -p "runatlantis.io/${locale}"
            rsync -a --delete --exclude='images/' --exclude='/contributing/adr/' "$dir" "runatlantis.io/${locale}/"
          done
          rm -rf .lingo-src

      - name: Localize links
        # Translated pages inherit their source's relative links, which would
        # resolve inside the locale and break the build for any page that is
        # not translated yet. Point those back at the English tree.
        run: |
          locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
          node scripts/localize-links.mjs $locales

      - name: Lint translated markdown
        run: |
          locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
          scripts/fix-translated-markdown.sh $locales

      - name: Upload translated output
        # Kept even when the integrity check fails: when a page trips a check,
        # the generated file is the only way to see what actually happened, and
        # the run is otherwise the only place it ever existed.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translated-docs
          # Locale dirs only. Extend this list when a locale is added.
          path: runatlantis.io/es/
          retention-days: 7

      - name: Check translation integrity
        # markdownlint counts as a check here too: Website Check lints every
        # locale on the resulting PR, and the model sometimes leaves findings
        # that `--fix` cannot repair (whitespace inside link text, a table row
        # split across lines). Failing pages are retried below before anything
        # is quarantined.
        id: checks
        run: |
          locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
          globs=()
          for locale in $locales; do globs+=("runatlantis.io/${locale}/**/*.md"); done

          ok=0
          node scripts/check-translation-integrity.mjs $locales > /tmp/integrity.txt 2>&1 || ok=1
          npx --yes markdownlint-cli2@0.20.0 --config .markdownlint.yaml "${globs[@]}" > /tmp/lint.txt 2>&1 || ok=1
          cat /tmp/integrity.txt /tmp/lint.txt
          if [ "$ok" -eq 0 ]; then
            exit 0
          fi

          # Integrity failures are reported as "✗ <file>"; markdownlint
          # findings start with "<file>:<line>". `grep` exits 1 on no match,
          # which under `set -e` would abort the step, hence the `|| true`.
          {
            grep '^✗' /tmp/integrity.txt | sed 's/^✗ //' || true
            grep -oE '^runatlantis\.io/[^:]+\.md' /tmp/lint.txt || true
          } | sort -u > /tmp/failed.txt

          if [ ! -s /tmp/failed.txt ]; then
            echo "::error::Checks failed but reported no files; see output above."
            exit 1
          fi
          echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Re-translate failing pages without the lockfile
        # Lingo.dev splits a page into numbered sections and reuses the
        # translation of every section whose source did not change. A section
        # inserted mid-page can make it reuse translations in the wrong place,
        # dropping a heading or a `:::` container, or leave a locked-pattern
        # placeholder unrestored. Translating just the failing pages again with
        # --force rebuilds them from the source instead of from i18n.lock.
        if: steps.checks.outputs.failed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
          scripts/stage-translation-sources.sh $locales

          # runatlantis.io/<locale>/<page> -> the page's path pattern in
          # i18n.json, which lingo.dev matches by substring.
          pages="$(sed -E 's#^runatlantis\.io/[^/]+/##' /tmp/failed.txt | sort -u)"
          file_flags=()
          while read -r page; do
            file_flags+=(--file ".lingo-src/[locale]/${page}")
          done <<< "$pages"

          for attempt in 1 2 3; do
            if npx --yes lingo.dev@0.138.4 run --force "${file_flags[@]}"; then
              break
            fi
            echo "::warning::Re-translation attempt ${attempt} had failures; retrying."
          done

          # Copy back only the retried pages; everything else already passed.
          while read -r page; do
            for locale in $locales; do
              if [ -f ".lingo-src/${locale}/${page}" ]; then
                cp ".lingo-src/${locale}/${page}" "runatlantis.io/${locale}/${page}"
              fi
            done
          done <<< "$pages"
          rm -rf .lingo-src

          node scripts/localize-links.mjs $locales
          scripts/fix-translated-markdown.sh $locales

      - name: Quarantine pages that still fail
        # A page that fails its checks after the retry is quarantined rather
        # than blocking the run: it is restored to its previous version, or
        # dropped if it never had one, and listed in the PR body. One bad page
        # out of forty should not discard thirty-nine good ones, and a missing
        # page is already a supported state - the link localizer and the
        # sidebar fall back to English. The second run must pass, so nothing
        # unverified is shipped.
        if: steps.checks.outputs.failed == 'true'
        run: |
          locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
          globs=()
          for locale in $locales; do globs+=("runatlantis.io/${locale}/**/*.md"); done

          run_checks() {
            local ok=0
            node scripts/check-translation-integrity.mjs $locales > /tmp/integrity.txt 2>&1 || ok=1
            npx --yes markdownlint-cli2@0.20.0 --config .markdownlint.yaml "${globs[@]}" > /tmp/lint.txt 2>&1 || ok=1
            cat /tmp/integrity.txt /tmp/lint.txt
            return $ok
          }

          if run_checks; then
            exit 0
          fi

          {
            grep '^✗' /tmp/integrity.txt | sed 's/^✗ //' || true
            grep -oE '^runatlantis\.io/[^:]+\.md' /tmp/lint.txt || true
          } | sort -u > /tmp/failed.txt

          if [ ! -s /tmp/failed.txt ]; then
            echo "::error::Checks failed but reported no files; see output above."
            exit 1
          fi

          while read -r file; do
            git checkout HEAD -- "$file" 2>/dev/null || rm -f "$file"
            echo "- \`${file}\`" >> /tmp/quarantined.txt
            echo "::warning file=${file}::Quarantined: failed translation checks"
          done < /tmp/failed.txt

          node scripts/localize-links.mjs $locales
          run_checks

      - name: Record translation sources
        # The integrity checker skips a committed page whose English source
        # changed after it was translated. Record which source this run
        # translated each rewritten page from, so a translation pull request
        # that merges after a later source change is still recognized as stale.
        run: |
          locales="$(node -e "process.stdout.write(require('./i18n.json').locale.targets.join(' '))")"
          node scripts/record-translation-sources.mjs $locales

      - name: Build the site
        # VitePress fails the build on dead relative links, so this is the real
        # gate: a locale that is missing pages or has mangled link targets
        # cannot reach a reviewer.
        run: |
          npm ci
          npm run website:build

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No translation changes."
            exit 0
          fi

          branch="docs/i18n-update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "docs: update machine-translated docs

          Generated by .github/workflows/translate-docs.yml from ${GITHUB_SHA}."
          git push origin "$branch"

          quarantined=""
          if [ -s /tmp/quarantined.txt ]; then
            quarantined="

          ### Quarantined pages

          These pages failed the translation checks (integrity or markdownlint), also after being re-translated without the lockfile, and were left at their previous version (or omitted). They need a look at the source:

          $(cat /tmp/quarantined.txt)"
          fi

          gh pr create \
            --title "docs: update machine-translated docs" \
            --body "Machine-translated from \`${GITHUB_SHA}\` by the \`translate-docs\` workflow.${quarantined}

          Only sections whose English source changed were re-translated; the rest came from \`i18n.lock\`.

          Checks already run in the job: translation integrity checker, VitePress build.

          Reviewer: please spot-check that flag names, YAML keys, and code samples are untouched, and give the security-sensitive pages a closer read." \
            --label "docs" \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch"
