name: update-debian-pins

# Bumps the Debian package pins in the Dockerfile to the newest version apt
# would install, including trixie-security, and opens a pull request.
#
# Renovate already tracks these pins, but its deb datasource only reads
# Packages.gz, and trixie-security only publishes Packages.xz. Without this,
# a Debian security release for a pinned package with an exact-version
# dependency (curl -> libcurl4t64) breaks the debian image build on every PR
# until someone bumps the pin by hand. Remove this workflow once Renovate can
# read Packages.xz: https://github.com/renovatebot/renovate/pull/35865

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'runatlantis/atlantis'
    name: Update Debian pins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: ci/debian-security-pins
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The bump step runs the updater and its dependencies, so keep the write
      # token out of .git/config; the push below passes it explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .github/scripts/update_debian_pins/go.mod
          cache-dependency-path: .github/scripts/update_debian_pins/go.sum

      - name: Bump pins
        id: bump
        working-directory: .github/scripts/update_debian_pins
        run: |
          go run . -dockerfile "${GITHUB_WORKSPACE}/Dockerfile" -summary "${RUNNER_TEMP}/summary.md"
          if git diff --quiet -- "${GITHUB_WORKSPACE}/Dockerfile"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.bump.outputs.changed == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.1@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3
          platforms: arm64,arm

      - name: Set up Docker Buildx
        if: steps.bump.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Pull requests opened with GITHUB_TOKEN do not trigger the image build,
      # so check here that apt resolves every pin together, on every platform
      # the image ships, inside the same base image the Dockerfile uses.
      - name: Check pins resolve
        if: steps.bump.outputs.changed == 'true'
        run: |
          debian_tag="$(sed -n 's/^ARG DEBIAN_TAG=//p' Dockerfile)"
          pins="$(cd .github/scripts/update_debian_pins && go run . -list -dockerfile "${GITHUB_WORKSPACE}/Dockerfile" | tr '\n' ' ')"
          printf '%s\n' \
            'ARG DEBIAN_TAG' \
            'FROM debian:${DEBIAN_TAG}' \
            'ARG PINS' \
            'RUN apt-get update -qq && apt-get install --simulate --no-install-recommends $PINS > /dev/null' |
            docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 \
              --build-arg DEBIAN_TAG="$debian_tag" --build-arg PINS="$pins" -

      - name: Open or update pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="fix(docker): bump debian pins to trixie-security versions"
          {
            echo "## what"
            echo
            cat "${RUNNER_TEMP}/summary.md"
            echo
            echo "## why"
            echo
            echo "- These versions are in \`trixie-security\`, which the base image's apt sources include. Renovate cannot see them because its deb datasource only reads \`Packages.gz\` and the security suite only publishes \`Packages.xz\`."
            echo "- A stale pin breaks the debian image build when a pinned package depends on an exact library version that security has bumped."
            echo
            echo "## tests"
            echo
            echo "- \`apt-get install --simulate\` resolves every pin together in \`debian:\${DEBIAN_TAG}\` on linux/amd64, linux/arm64 and linux/arm/v7."
            echo "- This pull request was opened with \`GITHUB_TOKEN\`, so CI does not start on its own. Close and reopen it to run the checks."
            echo
            echo "Generated by \`.github/workflows/update-debian-pins.yml\` from ${GITHUB_SHA}."
          } > "${RUNNER_TEMP}/body.md"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Match on the head repository too, so a fork PR that happens to use
          # the same branch name is never edited.
          existing="$(gh pr list --head "$BRANCH" --state open --json number,headRepositoryOwner \
            --jq "[.[] | select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")][0].number // empty")"
          # Empty when the branch does not exist. A failed lookup stops the job.
          remote_sha="$(git ls-remote "$remote" "refs/heads/${BRANCH}" | cut -f1)"

          if [ -n "$existing" ] && [ -n "$remote_sha" ] &&
            git fetch --quiet "$remote" "$remote_sha" &&
            git diff --quiet FETCH_HEAD -- Dockerfile; then
            echo "Pull request #${existing} already has these pins."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add Dockerfile
          git commit -s -m "$title"
          # Only replace the commit seen above, so a push made to the branch
          # since then (for example a review fix) is never overwritten.
          git push --force-with-lease="${BRANCH}:${remote_sha}" "$remote" "$BRANCH"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "${RUNNER_TEMP}/body.md"
          fi

      # The pins were bumped some other way (Renovate, or by hand), so an open
      # pull request from an earlier run is stale.
      - name: Close stale pull request
        if: steps.bump.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh pr list --head "$BRANCH" --state open --json number,headRepositoryOwner \
            --jq "[.[] | select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")][0].number // empty")"
          if [ -n "$existing" ]; then
            gh pr close "$existing" --delete-branch --comment "The Debian pins on main are already current, so this is no longer needed."
          fi
