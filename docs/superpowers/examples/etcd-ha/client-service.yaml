# Public/ingress service. It selects BOTH member and client replicas: every
# replica accepts ingress and owner-routes internally (design §108).
apiVersion: v1
kind: Service
metadata:
  name: atlantis
  labels:
    app.kubernetes.io/name: atlantis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlantis # matches both member and client pods
  ports:
    - { name: http, port: 4141, targetPort: http }
