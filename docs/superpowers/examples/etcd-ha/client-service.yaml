# Public/ingress service. Every Atlantis replica accepts ingress and owner-routes
# internally to the pull request's owner (design §108).
apiVersion: v1
kind: Service
metadata:
  name: atlantis
  labels:
    app.kubernetes.io/name: atlantis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlantis
  ports:
    - { name: http, port: 4141, targetPort: http }
