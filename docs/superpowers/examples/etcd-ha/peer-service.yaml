# Headless peer service. publishNotReadyAddresses is required so members can
# reach each other's peer URLs before any of them is ready, allowing quorum to
# form (design §324).
apiVersion: v1
kind: Service
metadata:
  name: atlantis-peer
  labels:
    app.kubernetes.io/name: atlantis
    atlantis.runatlantis.io/role: member
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: atlantis
    atlantis.runatlantis.io/role: member
  ports:
    - { name: etcd-peer, port: 2380 }
    - { name: etcd-client, port: 2379 }
    - { name: http, port: 4141 }
    - { name: internal, port: 4142 }
