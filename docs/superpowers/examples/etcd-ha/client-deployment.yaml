# Atlantis in EXTERNAL etcd mode (phase 1). Every replica accepts ingress and
# owner-routes internally; replicas are independently autoscalable (0..N) and do
# not participate in Raft, so scaling them never changes etcd membership
# (design §342). Point --etcd-endpoints at your own external etcd cluster
# (bring-your-own, or a separate etcd StatefulSet); the embedded in-process
# voter topology is deferred to phase 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlantis
  labels:
    app.kubernetes.io/name: atlantis
    atlantis.runatlantis.io/role: client
spec:
  replicas: 2 # HPA target; free to scale.
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis
      atlantis.runatlantis.io/role: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis
        atlantis.runatlantis.io/role: client
    spec:
      containers:
        - name: atlantis
          image: ghcr.io/runatlantis/atlantis:latest
          args:
            - server
            - --locking-db-type=etcd
            - --etcd-mode=external
            - --etcd-deployment-id=$(ETCD_DEPLOYMENT_ID)
            - --etcd-namespace=/atlantis
            # Replace with your external etcd client endpoints (all https, hostname-verified).
            - --etcd-endpoints=https://etcd-0.etcd:2379,https://etcd-1.etcd:2379,https://etcd-2.etcd:2379
            - --etcd-ca-file=/etc/atlantis/tls/ca.pem
            - --etcd-cert-file=/etc/atlantis/tls/client.pem
            - --etcd-key-file=/etc/atlantis/tls/client-key.pem
            - --replica-id=$(POD_NAME)
            - --replica-advertise-url=https://$(POD_IP):4141
            - --replica-advertise-allowlist=$(POD_NAMESPACE_CIDR)
            - --internal-command-token-file=/etc/atlantis/internal/token
            - --internal-command-ca-file=/etc/atlantis/internal/ca.pem
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          ports:
            - { name: http, containerPort: 4141 }
            - { name: internal, containerPort: 4142 }
          readinessProbe:
            httpGet: { path: /readyz, port: http, scheme: HTTPS }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTPS }
            periodSeconds: 15
          volumeMounts:
            - { name: tls, mountPath: /etc/atlantis/tls, readOnly: true }
            - { name: internal, mountPath: /etc/atlantis/internal, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: atlantis-etcd-tls }
        - name: internal
          secret: { secretName: atlantis-internal-transport }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlantis-client
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlantis-client
  minReplicas: 0
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
