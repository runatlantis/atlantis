# Keep at least one Atlantis replica available during voluntary disruptions so
# ingress and owner-routing stay up. (etcd quorum is provided by the separate
# external etcd cluster and has its own PDB; the embedded-voter quorum PDB is a
# phase-2 concern.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlantis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis
      atlantis.runatlantis.io/role: client
