# Member replicas: Atlantis + embedded etcd voter. Fixed size (3/5/7).
# Parallel startup + OnDelete updates are required for safe quorum formation and
# controlled membership transitions (design §324).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlantis-member
  labels:
    app.kubernetes.io/name: atlantis
    atlantis.runatlantis.io/role: member
spec:
  serviceName: atlantis-peer
  replicas: 3 # 3, 5, or 7 only; change only via the membership-transition runbook.
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis
      atlantis.runatlantis.io/role: member
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis
        atlantis.runatlantis.io/role: member
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  atlantis.runatlantis.io/role: member
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              atlantis.runatlantis.io/role: member
      containers:
        - name: atlantis
          image: ghcr.io/runatlantis/atlantis:latest # pin in production
          args:
            - server
            - --locking-db-type=etcd
            - --etcd-mode=embedded
            - --etcd-deployment-id=$(ETCD_DEPLOYMENT_ID)
            - --etcd-namespace=/atlantis
            - --etcd-embedded-config-file=/etc/atlantis/etcd/embedded.json
            - --etcd-embedded-voter-count=3
            - --etcd-embedded-lifecycle=restart
            - --etcd-embedded-startup-purpose=serve
            - --etcd-embedded-identity-file=/etc/atlantis/etcd/identity.json
            - --etcd-ca-file=/etc/atlantis/tls/ca.pem
            - --etcd-cert-file=/etc/atlantis/tls/client.pem
            - --etcd-key-file=/etc/atlantis/tls/client-key.pem
            - --replica-id=$(POD_NAME)
            - --replica-advertise-url=https://$(POD_NAME).atlantis-peer:4141
            - --replica-advertise-allowlist=$(POD_NAMESPACE_CIDR)
            - --internal-command-token-file=/etc/atlantis/internal/token
            - --internal-command-ca-file=/etc/atlantis/internal/ca.pem
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - { name: http, containerPort: 4141 }
            - { name: etcd-client, containerPort: 2379 }
            - { name: etcd-peer, containerPort: 2380 }
            - { name: internal, containerPort: 4142 }
          readinessProbe:
            httpGet: { path: /readyz, port: http, scheme: HTTPS }
            # Allow the full etcd startup timeout for quorum to form.
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTPS }
            periodSeconds: 15
          resources:
            requests: { cpu: "1", memory: 2Gi } # firm reservations; do not let
            limits: { cpu: "2", memory: 4Gi }   # Terraform starve etcd I/O.
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: etcd-config, mountPath: /etc/atlantis/etcd, readOnly: true }
            - { name: tls, mountPath: /etc/atlantis/tls, readOnly: true }
            - { name: internal, mountPath: /etc/atlantis/internal, readOnly: true }
      volumes:
        - name: etcd-config
          secret: { secretName: atlantis-etcd-config }
        - name: tls
          secret: { secretName: atlantis-etcd-tls }
        - name: internal
          secret: { secretName: atlantis-internal-transport }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName: <low-latency-durable-class>
